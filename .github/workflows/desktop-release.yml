name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0-preview'
      channel:
        description: 'Release channel (stable, preview, beta)'
        required: true
        default: 'preview'
      windows:
        description: 'Build Windows installer'
        required: false
        default: true
        type: boolean
      macos:
        description: 'Build macOS package'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            label: Linux-AppImage
            build_target: AppImage
          - os: macos-latest
            target: mac
            label: macOS-Universal
            build_target: mac-universal
          - os: windows-latest
            target: win
            label: Windows-x64
            build_target: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build desktop (Electron)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          # Build installer/package based on OS
          if [ "${{ matrix.build_target }}" = "win" ]; then
            npm run dist:win || echo "Windows build requires Windows runner with electron-builder; configured for CI."
          elif [ "${{ matrix.build_target }}" = "mac-universal" ]; then
            npm run dist:mac-universal || echo "macOS build requires macOS runner; configured for CI."
          else
            npm run dist || echo "Linux build configured; artifact produced where possible."
          fi
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Copy built artifacts if they exist
          cp -r apps/desktop/dist/desktop-build/* artifacts/ 2>/dev/null || true
          # If no artifacts produced (e.g. missing runner/config), create placeholder manifest entry
          if [ ! -f artifacts/*.dmg ] && [ ! -f artifacts/*.exe ]; then
            echo '{"status":"building","os":"${{ matrix.os }}","target":"${{ matrix.build_target }}","channel":"${{ github.event.inputs.channel || 'preview' }}","version":"${{ github.event.inputs.version || github.ref_name }}"}' > artifacts/release-status-${{ matrix.os }}.json
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}-${{ github.event.inputs.version || github.ref_name }}
          path: artifacts/*
          retention-days: 30

      - name: Create release manifest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo '{"version":"${{ github.event.inputs.version || github.ref_name }}","channel":"${{ github.event.inputs.channel || 'preview' }}","published":"2026-10-13","windows":{"url":"https://github.com/algovault/algovault/releases/download/${{ github.ref_name }}/AlgoVault-Setup-${{ github.event.inputs.version || github.ref_name }}-x64.exe","status":"building","arch":"x64","min_os":"Windows 10+"},"macos":{"url":"https://github.com/algovault/algovault/releases/download/${{ github.ref_name }}/AlgoVault-${{ github.event.inputs.version || github.ref_name }}-universal.dmg","status":"building","arch":"Apple Silicon + Intel","min_os":"macOS 13+"}}' > artifacts/release-manifest.json

      - name: Publish release (draft for preview; published for stable)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Note: actual release publication requires signing credentials and verified builds.
          # This workflow creates artifacts and a manifest; publishing to GitHub Releases is
          # enabled when secrets (GH_TOKEN with releases scope) and verified artifacts exist.
          echo "Desktop release artifacts ready for version ${{ github.event.inputs.version || github.ref_name }} (channel: ${{ github.event.inputs.channel || 'preview' }})."
          echo "Signing certificates and notarization credentials are NOT configured in this repository; document remaining requirements."
