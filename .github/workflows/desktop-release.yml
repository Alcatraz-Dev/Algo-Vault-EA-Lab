name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0-preview'
      channel:
        description: 'Release channel (stable, preview, beta)'
        required: true
        default: 'preview'
      windows:
        description: 'Build Windows installer'
        required: false
        default: true
        type: boolean
      macos:
        description: 'Build macOS package'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            label: Linux-AppImage
            build_target: AppImage
          - os: macos-latest
            target: mac
            label: macOS-ARM64
            build_target: mac-arm64
          - os: windows-latest
            target: win
            label: Windows-x64
            build_target: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Validate public Firebase build variables
        shell: bash
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          missing=()
          for name in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_DATABASE_URL \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            printf 'Missing repository/environment Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve package version
        if: github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux'
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --workspace=algovault-desktop
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build web app for Electron
        if: github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux'
        run: npm run build
        env:
          NEXT_OUTPUT_STANDALONE: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Verify macOS signing secrets
        if: matrix.target == 'mac' && (github.event_name != 'workflow_dispatch' || inputs.macos)
        shell: bash
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            printf 'Missing macOS signing/notarization secrets: %s\n' "${missing[*]}" >&2
            printf 'Configure a Developer ID Application certificate (base64 .p12 in CSC_LINK) and Apple notarization credentials as GitHub Actions secrets.\n' >&2
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build desktop package
        if: github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux'
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build --workspace=algovault-desktop
          case "${{ matrix.target }}" in
            mac) npx electron-builder --mac --arm64 --publish=never ;;
            win) npx electron-builder --win --x64 --publish=never ;;
            linux) npx electron-builder --linux --x64 --publish=never ;;
            *) echo "Unsupported desktop target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
        working-directory: apps/desktop

      - name: Prepare artifacts and manifest
        if: github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_LABEL: ${{ matrix.label }}
        run: |
          mkdir -p artifacts
          cp -R apps/desktop/dist/desktop-build/. artifacts/
          case "$RELEASE_TARGET" in
            mac) artifact_pattern='*.dmg' ;;
            win) artifact_pattern='*.exe' ;;
            linux) artifact_pattern='*.AppImage' ;;
          esac
          if ! compgen -G "artifacts/$artifact_pattern" > /dev/null; then
            echo "Expected $RELEASE_TARGET package ($artifact_pattern) was not built." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, writeFileSync } from 'node:fs';
          const files = readdirSync('artifacts')
            .filter((name) => /\.(dmg|zip|exe|AppImage)$/i.test(name))
            .map((name) => ({ name, size: statSync(`artifacts/${name}`).size }));
          if (!files.length) throw new Error('No desktop package artifacts were produced');
          writeFileSync('artifacts/release-manifest.json', JSON.stringify({
            version: process.env.RELEASE_VERSION.replace(/^v/, ''),
            channel: process.env.RELEASE_CHANNEL,
            platform: process.env.RELEASE_LABEL,
            target: process.env.RELEASE_TARGET,
            status: 'built',
            artifacts: files,
          }, null, 2) + '\n');
          NODE

      - name: Upload artifacts
        if: github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}-${{ github.event.inputs.version || github.ref_name }}
          path: artifacts/*
          retention-days: 30

      - name: Release status
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || (matrix.target == 'mac' && inputs.macos) || (matrix.target == 'win' && inputs.windows) || matrix.target == 'linux')
        run: echo "Desktop artifacts and their built manifest are attached to this workflow run. macOS artifacts are Developer ID signed and notarized when the CSC_* / APPLE_* secrets are configured. GitHub Release publication is not configured."
