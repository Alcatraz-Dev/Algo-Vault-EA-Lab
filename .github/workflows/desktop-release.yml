name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0-preview)'
        required: true
        default: '0.1.0-preview'
      channel:
        description: 'Release channel (preview, beta, stable)'
        required: true
        default: 'preview'
      prerelease:
        description: 'Mark as GitHub prerelease (must match channel: stable=false, preview/beta=true)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # Fail before any long build starts when the version, channel, and
  # prerelease flag disagree. This is the single source of truth for the
  # release label used by the build and publish jobs.
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate release channel
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: node scripts/release-channel.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            label: macOS-ARM64
            arch: arm64
            artifact_pattern: '*.dmg'
          - os: windows-latest
            target: win
            label: Windows-x64
            arch: x64
            artifact_pattern: '*.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Detect signing capability (macOS only)
        if: matrix.target == 'mac'
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS build will be UNSIGNED and UNNOTARIZED. Gatekeeper will show a warning on first open. This is expected for preview releases."
            printf 'Missing Apple credentials (preview build will be unsigned): %s\n' "${missing[*]}"
          else
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing credentials detected — build will be Developer ID signed and notarized."
          fi

      - name: Resolve package version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --workspace=algovault-desktop

      - name: Validate public Firebase build variables
        shell: bash
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          missing=()
          for name in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_DATABASE_URL \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            printf 'Missing repository/environment Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Build web app for Electron (standalone)
        run: npm run build
        env:
          NEXT_OUTPUT_STANDALONE: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Compile desktop main process
        working-directory: apps/desktop
        run: npm run build

      # ── macOS build ──
      # When Apple credentials are present, package.json's notarize:true runs
      # the full Developer ID signing + notarization pipeline.
      # When absent (preview), we override notarize to false via the CLI.
      # The DMG is still built with Hardened Runtime and entitlements, but
      # is unsigned/unnotarized — Gatekeeper will warn on first launch.

      - name: Build macOS package (signed + notarized)
        if: matrix.target == 'mac' && steps.signing.outputs.can_sign == 'true'
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish=never

      - name: Build macOS package (UNSIGNED preview)
        if: matrix.target == 'mac' && steps.signing.outputs.can_sign != 'true'
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --mac --arm64 --publish=never --config.mac.notarize=false

      # ── Windows build ──

      - name: Build Windows installer
        if: matrix.target == 'win'
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --win --x64 --publish=never

      # ── Verify and collect artifacts ──

      - name: Verify required artifacts exist
        id: verify
        shell: bash
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact_pattern }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if ! compgen -G "apps/desktop/dist/desktop-build/${ARTIFACT_PATTERN}" > /dev/null 2>&1; then
            echo "ERROR: Expected $RELEASE_TARGET artifact (${ARTIFACT_PATTERN}) was not built." >&2
            echo "Check the electron-builder output above for errors." >&2
            exit 1
          fi
          echo "Required artifact ${ARTIFACT_PATTERN} present."

      - name: Collect artifacts
        shell: bash
        env:
          ARTIFACT_PATTERN: ${{ matrix.artifact_pattern }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          cp apps/desktop/dist/desktop-build/*.dmg artifacts/ 2>/dev/null || true
          cp apps/desktop/dist/desktop-build/*.zip artifacts/ 2>/dev/null || true
          cp apps/desktop/dist/desktop-build/*.exe artifacts/ 2>/dev/null || true
          # Verify the expected artifact was copied
          if ! compgen -G "artifacts/${ARTIFACT_PATTERN}" > /dev/null 2>&1; then
            echo "ERROR: Failed to collect ${RELEASE_TARGET} artifacts." >&2
            exit 1
          fi
          ls -la artifacts/

      # ── Record the signing configuration that actually built this artifact ──
      # The publish job turns these files into release-note wording, so notes
      # never claim a build is signed unless this metadata says it was.

      - name: Record macOS signing status
        if: matrix.target == 'mac'
        shell: bash
        env:
          CAN_SIGN: ${{ steps.signing.outputs.can_sign }}
        run: |
          set -euo pipefail
          if [[ "${CAN_SIGN:-false}" == "true" ]]; then
            printf '{"signed":true,"notarized":true}\n' > artifacts/build-meta-macos.json
          else
            printf '{"signed":false,"notarized":false}\n' > artifacts/build-meta-macos.json
          fi

      - name: Record Windows signing status
        if: matrix.target == 'win'
        shell: bash
        run: |
          set -euo pipefail
          # This workflow never configures Windows code signing.
          printf '{"signed":false}\n' > artifacts/build-meta-windows.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.target }}
          path: artifacts/*
          retention-days: 30

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-artifacts-*
          merge-multiple: true

      - name: Verify required release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloaded artifacts:"
          ls -la release-assets/ || true

          errors=0
          for ext in dmg exe; do
            if ! compgen -G "release-assets/*.${ext}" > /dev/null 2>&1; then
              echo "ERROR: Missing required artifact: *.${ext}" >&2
              errors=$((errors + 1))
            fi
          done
          if ((errors)); then
            echo "::error::Build succeeded but required artifacts are missing. Check the build jobs above." >&2
            exit 1
          fi
          echo "All required artifacts present."

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          node scripts/release-notes.mjs \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --assets-dir release-assets \
            --out release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.release_name }} v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Keep the website download manifest accurate ──
      # The homepage renders install buttons only from
      # public/downloads/releases.json. Regenerate it from the assets that were
      # actually uploaded, so publishing a release can never leave the site
      # pointing at stale or missing installers.
      - name: Sync website download manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          node scripts/desktop-release-manifest.mjs --tag "$TAG" --channel "$CHANNEL" --write
          if git diff --quiet -- public/downloads/releases.json; then
            echo "Website download manifest already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/releases.json
          git commit -m "chore: sync desktop download manifest for ${TAG}"
          git push origin HEAD:main
