<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4d00">
  <title>AlgoVault - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111111;
      color: #f9f9f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #ff4d00 0%, #ff8c42 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .logo svg { width: 32px; height: 32px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { color: #a3a3a3; font-size: 16px; line-height: 1.5; margin-bottom: 24px; max-width: 320px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #232323;
      border: 1px solid #383838;
      border-radius: 12px;
      font-size: 14px;
      color: #a3a3a3;
      margin-bottom: 24px;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      background: #ff4d00;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    button {
      background: linear-gradient(135deg, #ff4d00 0%, #e85d04 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid #ff4d00; outline-offset: 2px; }
    .retry-hint { font-size: 12px; color: #727272; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3h18v18H3z" />
      <path d="m9 17 5-5-5-5" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>AlgoVault needs an internet connection to show live market data, account balances, and trading signals.</p>
  <div class="status">
    <span>Waiting for connection...</span>
  </div>
  <button id="retryBtn">Try Again</button>
  <p class="retry-hint">Trading data is never cached for security. Last available data will be shown once reconnected.</p>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const statusEl = document.querySelector('.status span');

    function checkConnection() {
      statusEl.textContent = 'Checking connection...';
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          statusEl.textContent = 'Still offline. Retrying in 5s...';
          setTimeout(checkConnection, 5000);
        });
    }

    retryBtn.addEventListener('click', checkConnection);

    // Auto-retry when connection restored
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Initial check
    checkConnection();
  </script>
</body>
</html>
